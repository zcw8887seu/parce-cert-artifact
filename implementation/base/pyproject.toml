[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parce-exp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "matplotlib",
  "pytest",
  "hypothesis",
  "jsonschema",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["parce_exp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
